<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/favicon.jpeg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offshore Minds | Real Estate Knowledge Process Outsourcing</title>
  <meta name="description"
    content="Offshore Minds provides specialized Knowledge Process Outsourcing (KPO) services for the real estate industry, including financial analysis, asset management support, and lease administration." />
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0D0B21;
    }

    #initial-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0D0B21;
      /* bloom-dark */
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(93, 92, 222, 0.3);
      /* bloom-primary with opacity */
      border-top: 4px solid #5D5CDE;
      /* bloom-primary */
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="initial-loader">
      <div class="spinner"></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
